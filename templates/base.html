<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ToDoリスト{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="logo" href="{{ url_for('index') }}">ToDoリスト</a>
      {% block header_action %}<a class="btn fill" href="{{ url_for('new', **(nav or {})) }}">＋ 登録</a>{% endblock %}
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% block toast %}{% endblock %}
  <script>
    // お知らせ（登録しました・完了しました など）は 8 秒で消す
    setTimeout(function () {
      var t = document.querySelector(".toast");
      if (t) t.classList.add("hide");
    }, 8000);
  </script>
</body>
</html>
