<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ToDoリスト{% endblock %}</title>
  <meta name="theme-color" content="#fbfaf7">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <meta name="apple-mobile-web-app-title" content="ToDoリスト">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="logo" href="{{ url_for('index') }}">ToDoリスト</a>
      <nav class="bar-nav">
        <a class="btn text" href="{{ url_for('review') }}">ふり返り</a>
        {% block header_action %}<a class="btn fill" href="{{ url_for('new', **(nav or {})) }}">＋ 登録</a>{% endblock %}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% block toast %}{% endblock %}
  <script>
    // お知らせ（登録しました・完了しました など）は 8 秒で消す
    setTimeout(function () {
      var t = document.querySelector(".toast");
      if (t) t.classList.add("hide");
    }, 8000);
    // ホーム画面に追加したときに使う（電波がないときに「つながっていません」を出す）
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
  </script>
</body>
</html>
